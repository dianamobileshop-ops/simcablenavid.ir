name: Deploy plugin to simcablenavid.ir

on:
  push:
    branches: [main]
    paths:
      - 'navid-price-table-*.zip'
  workflow_dispatch:

permissions:
  contents: read

env:
  SSH_HOST: cip17.mizbanfadns.net
  SSH_PORT: "22"
  SSH_USER: simcable
  REMOTE_PLUGIN_DIR: public_html/wp-content/plugins/navid-price-table

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-plugin
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack the newest plugin zip
        run: |
          ZIP=$(ls navid-price-table-*.zip | sort -V | tail -n 1)
          echo "Deploying $ZIP"
          rm -rf /tmp/npt && mkdir -p /tmp/npt
          unzip -q "$ZIP" -d /tmp/npt
          test -f /tmp/npt/navid-price-table/navid-price-table.php

      - name: Prepare SSH key (passphrase removed in memory only)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -p -P "$SSH_KEY_PASSPHRASE" -N "" -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test the connection
        run: ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'echo connected'

      - name: Back up the current plugin on the server
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'mkdir -p ~/npt-private-backups && if [ -d ~/public_html/wp-content/plugins/navid-price-table ]; then tar -czf ~/npt-private-backups/deploy-$(date +%Y%m%d-%H%M%S).tar.gz -C ~/public_html/wp-content/plugins navid-price-table; fi'

      - name: Upload the new plugin files
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            /tmp/npt/navid-price-table/ \
            "$SSH_USER@$SSH_HOST:$REMOTE_PLUGIN_DIR/"

      - name: Warm the page caches
        run: |
          curl -s -o /dev/null https://simcablenavid.ir/
          curl -s -o /dev/null https://simcablenavid.ir/price-list-wire-and-cable-navid/

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
